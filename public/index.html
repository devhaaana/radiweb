<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<title>radiweb</title>
	<meta name="description" content="radiweb is a web-based application for streaming broadcasts from radiko.jp, a Japanese radio service, outside of Japan." />
	
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-BN9Z6VQTNE"></script>
	<script src="/assets/js/analytics.js"></script>

	<meta name="google-site-verification" content="TSU4jh-DtyPQt63JRpivnLAKbx2OtJg37OVvd0qD9UQ" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

	<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
	<link rel="stylesheet" href="assets/css/style.css" />
	<link rel="stylesheet" href="/assets/css/window.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

	<link rel="icon" type="image/png" sizes="16x16" href="/assets/icon/favicon-16x16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="96x96" href="/assets/icon/favicon-96x96.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/icon/apple-icon-180x180.png">
	<link rel="manifest" href="/assets/icon/manifest.json">
</head>
<body>

	<div class="navigation-container">
		<nav class="navigation">
			<div class="navigation-logo">
				<a href="/"><img src="/assets/image/radiweb-banner.png"></a>
			</div>
			<div class="navigation-menu">
				<a href="#station-list" id="reload">새로고침</a>

				<div class="language-selector">
					<button type="button" class="dropdown-toggle">한국어 🇰🇷</button>
					<div class="dropdown-toggle-content">
						<a href="#" data-lang="ko">한국어 🇰🇷</a>
						<a href="#" data-lang="en">English 🇺🇸</a>
						<a href="#" data-lang="ja">日本語 🇯🇵</a>
					</div>
				</div>
			</div>
		</nav>
	</div>

	<main>
		<section id="dashboard">
			<div class="radio-dashboard">
				<aside class="station-map">
					<div id="map"></div>
				</aside>

				<div class="station-list-container">
					<div class="station-count-container">
					    <span id="station-count-number">0</span>
					    <span id="station-count-text">개의 방송국이 있습니다.</span>
					</div>
					<aside id="station-list" class="station-list"></aside>
				</div>

				<div class="player-section">
					<div class="player-container">
						<div class="now-playing">
							<img src="/assets/image/radiweb-icon.png" alt="Current Station" class="station-cover" />
							<div class="program-info-container">
								<h2 class="program-title">radiweb</h2>
							</div>
							<div class="program-info-container">
								<h4 class="program-performer"></h4>
							</div>
						</div>
						<div class="progress-container">
							<progress id="progress-bar" value="0" max="100"></progress>
							<div class="progress-time-range">
								<span id="start-time">00:00</span>
								<span id="end-time">00:00</span>
							</div>
						</div>
						<div class="controls">
							<button id="playPauseBtn"><i class="bi bi-play-circle-fill"></i></button>
						</div>
						<div class="volume-wrapper">
							<i id="volume-icon" class="bi bi-volume-up"></i>
							<input type="range" id="volume-control" min="0" max="10" value="5">
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<footer id="footer">
        <p id="name">radiweb</p>
        <p id="contact">Github: <a href="https://github.com/devhaaana" target="_blank">devhaaana</a></p>
        <p id="copyright">&copy; 2025 Hana Go. All rights reserved.</p>
    </footer>

	<audio id="player" autoplay playsinline type="application/vnd.apple.mpegurl"></audio>
	
</body>
	<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
	<script src="assets/js/script.js"></script>
	<script src="assets/js/geojson.js"></script>
	<script src="assets/js/audio.js"></script>
	<script src="assets/js/radiko.js"></script>
</html>
